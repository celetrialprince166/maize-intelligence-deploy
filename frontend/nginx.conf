server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Backend health check, proxied end-to-end (used by external verification,
    # not the container's own HEALTHCHECK — see Dockerfile).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Strips the /api/ prefix — FastAPI routes are mounted at root.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No client-side router in this SPA today, but this is a safety net for
    # deep-link/refresh behavior if one is added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
