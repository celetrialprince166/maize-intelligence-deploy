server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Only intercepts 5xx (a raw backend traceback should never reach the
    # client) — 4xx responses pass through untouched since the app relies
    # on FastAPI's real JSON error bodies (e.g. "Invalid GeoJSON geometry").
    proxy_intercept_errors on;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type application/json;
        return 502 '{"detail":"Upstream error"}';
    }

    # Backend health check, proxied end-to-end (used by external verification,
    # not the container's own HEALTHCHECK — see Dockerfile).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Strips the /api/ prefix — FastAPI routes are mounted at root.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /analyze trains a classifier in Earth Engine per request and can
        # legitimately run for one to two minutes. nginx defaults to a 60s
        # read timeout, which cut those requests off with a 504 while the
        # backend was still working — so this matches the backend's own
        # 300s budget (see the asyncio.wait_for timeout in app/main.py)
        # instead of silently truncating long analyses.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # No client-side router in this SPA today, but this is a safety net for
    # deep-link/refresh behavior if one is added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
