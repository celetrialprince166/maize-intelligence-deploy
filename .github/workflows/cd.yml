name: CD

# Triggered by CI's completion rather than push directly — this is the
# pattern GitHub recommends for gating a secrets-bearing deploy workflow on
# a checks workflow that also runs on PRs (PR runs never get repo secrets;
# workflow_run always executes with base-repo permissions against the exact
# commit CI validated). This also means the dependency on CI passing is a
# hard `if`, not just "ran after" — a failed CI run never reaches this job.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # e.g. 183631301567.dkr.ecr.us-east-1.amazonaws.com

jobs:
  terraform-apply:
    name: Terraform apply (infra changes)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Requires a "infra-approval" GitHub Environment with required reviewers
    # configured in repo settings — infra changes are reviewed, image
    # deploys below are not. One-time manual setup, not doable from YAML.
    environment: infra-approval
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.1"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        working-directory: infra/environments/staging
        run: terraform init -input=false
      - name: Plan
        working-directory: infra/environments/staging
        run: terraform plan -input=false -out=tfplan
      - name: Apply
        working-directory: infra/environments/staging
        run: terraform apply -input=false -auto-approve tfplan

  build-and-push:
    name: Build & push images to ECR
    if: github.event.workflow_run.conclusion == 'success'
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Build & push backend
        working-directory: backend
        run: |
          docker build -t "$ECR_REGISTRY/maize-staging-backend:${{ github.event.workflow_run.head_sha }}" .
          docker push "$ECR_REGISTRY/maize-staging-backend:${{ github.event.workflow_run.head_sha }}"
      - name: Build & push frontend
        working-directory: frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_COGNITO_REGION=${{ env.AWS_REGION }} \
            --build-arg VITE_COGNITO_USER_POOL_ID=${{ vars.COGNITO_USER_POOL_ID }} \
            --build-arg VITE_COGNITO_CLIENT_ID=${{ vars.COGNITO_CLIENT_ID }} \
            --build-arg VITE_MAPBOX_TOKEN=${{ vars.MAPBOX_TOKEN }} \
            -t "$ECR_REGISTRY/maize-staging-frontend:${{ github.event.workflow_run.head_sha }}" .
          docker push "$ECR_REGISTRY/maize-staging-frontend:${{ github.event.workflow_run.head_sha }}"
      - name: Check ECR scan findings (fail on CRITICAL)
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          # scan_on_push means the scan starts the moment the push above
          # completes, but it's async — poll each repo until it's done,
          # then gate the deploy on it instead of leaving scan-on-push as a
          # checkbox nobody reads.
          for repo in maize-staging-backend maize-staging-frontend; do
            echo "Waiting for scan: $repo:$IMAGE_TAG"
            for i in $(seq 1 30); do
              STATUS=$(aws ecr describe-image-scan-findings \
                --repository-name "$repo" --image-id imageTag="$IMAGE_TAG" \
                --region "$AWS_REGION" --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")
              [ "$STATUS" = "COMPLETE" ] && break
              [ "$STATUS" = "FAILED" ] && { echo "Scan failed for $repo"; exit 1; }
              sleep 5
            done

            CRITICAL_TOTAL=$(aws ecr describe-image-scan-findings \
              --repository-name "$repo" --image-id imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo 0)
            [ "$CRITICAL_TOTAL" = "None" ] && CRITICAL_TOTAL=0

            # Only fail on CRITICALs with an actual fix available — base-OS
            # packages (glibc, perl-base) routinely carry CRITICAL CVEs with
            # no upstream patch yet; blocking every deploy on those forever
            # just trains people to disable the gate. Unfixable ones are
            # still counted and printed, never silently dropped.
            FIXABLE_CRITICAL=$(aws ecr describe-image-scan-findings \
              --repository-name "$repo" --image-id imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query "length(imageScanFindings.findings[?severity=='CRITICAL' && attributes[?key=='fix_available' && value=='YES']])" \
              --output text 2>/dev/null || echo 0)

            echo "$repo: $CRITICAL_TOTAL CRITICAL total ($FIXABLE_CRITICAL with a fix available)"

            if [ "$FIXABLE_CRITICAL" -gt 0 ]; then
              echo "::error::$repo:$IMAGE_TAG has $FIXABLE_CRITICAL fixable CRITICAL vulnerabilities — blocking deploy"
              exit 1
            fi
          done

  deploy:
    name: Deploy via SSM (no SSH)
    if: github.event.workflow_run.conclusion == 'success'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Send deploy command over SSM
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          GEE_SECRET_NAME: ${{ vars.GEE_SECRET_NAME }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=maize-staging-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          # Quoted heredoc ('EOF') — no variable expansion happens here, so
          # there's no backslash-escaping ambiguity between "expand now" and
          # "expand later on the instance". Placeholders are substituted by
          # sed afterward, and Python does the JSON string-escaping for the
          # SSM parameters file (the same pattern proven working manually).
          cat > deploy_script.sh <<'EOF'
          set -euo pipefail
          aws secretsmanager get-secret-value --secret-id '__GEE_SECRET_NAME__' --region __AWS_REGION__ --query SecretString --output text > /opt/app/gee-key.json
          # 644, not 600: the file is root-owned but read inside the
          # container by the non-root `app` user (Dockerfile USER app) via
          # a bind mount, which keeps host ownership/perms as-is — 600
          # caused a real "Permission denied" hit in the backend at runtime.
          chmod 644 /opt/app/gee-key.json
          TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
          PUBLIC_IP=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
          aws ecr get-login-password --region __AWS_REGION__ | docker login --username AWS --password-stdin __ECR_REGISTRY__
          export BACKEND_IMAGE=__ECR_REGISTRY__/maize-staging-backend:__IMAGE_TAG__
          export FRONTEND_IMAGE=__ECR_REGISTRY__/maize-staging-frontend:__IMAGE_TAG__
          export PUBLIC_IP
          export ALLOWED_ORIGINS=https://$PUBLIC_IP
          docker compose -f /opt/app/docker-compose.yml pull
          docker compose -f /opt/app/docker-compose.yml up -d
          EOF

          sed -i \
            -e "s|__GEE_SECRET_NAME__|$GEE_SECRET_NAME|g" \
            -e "s|__AWS_REGION__|$AWS_REGION|g" \
            -e "s|__ECR_REGISTRY__|$ECR_REGISTRY|g" \
            -e "s|__IMAGE_TAG__|$IMAGE_TAG|g" \
            deploy_script.sh

          python3 -c "
          import json
          script = open('deploy_script.sh').read()
          json.dump({'commands': [script]}, open('params.json', 'w'))
          "

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          [ "$STATUS" = "Success" ]
