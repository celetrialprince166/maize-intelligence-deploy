name: CI

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [master]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          # CI build-time values only, for compile verification — the real
          # deploy build uses production values passed as Docker build-args
          # in cd.yml, sourced from GitHub Environment variables/secrets.
          VITE_API_URL: /api
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: us-east-1_vfe6JbU6G
          VITE_COGNITO_CLIENT_ID: 744ah7v7iddsshrm9mm02bnd9i
        run: npm run build

  terraform-fmt:
    name: Terraform format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.1"
      - run: terraform fmt -check -recursive infra/

  terraform-validate:
    name: Terraform validate + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - infra/modules/network
          - infra/modules/security_group
          - infra/modules/iam
          - infra/modules/dynamodb
          - infra/modules/secrets
          - infra/modules/ecr
          - infra/modules/oidc
          - infra/modules/ec2
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.1"
      - name: Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate
      - name: Test
        working-directory: ${{ matrix.module }}
        run: terraform test
